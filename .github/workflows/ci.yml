name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node: [22.x, 24.x]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix tools/specification --ignore-scripts
      - run: node specification/validate-package.mjs
      - run: node tools/specification/node_modules/@fission-ai/openspec/bin/openspec.js validate --all --strict --no-interactive --json
        env:
          OPENSPEC_TELEMETRY: "0"
          DO_NOT_TRACK: "1"
      - run: npm run check
      - run: npm run validate:skill
      - run: node ./bin/afh.js benchmark --giant-records 2000
      - run: npm pack --dry-run
